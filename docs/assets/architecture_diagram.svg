<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#080e1b" />
    </linearGradient>

    <!-- Layer Card Gradients -->
    <linearGradient id="cardGradClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132140" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b1426" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardGradSymbolic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c38" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#091b24" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardGradNeural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a44" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#130b24" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardGradSecurity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#331c17" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#180e0c" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardGradAdapters" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102534" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0a1722" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Glow Accents -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #7dd3fc; letter-spacing: 1px; }
    .layer-header { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .badge-text { font-family: 'JetBrains Mono', 'Roboto Mono', monospace; font-size: 10px; font-weight: 600; }
    .item-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .item-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 400; fill: #94a3b8; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; }
  </style>

  <!-- Deep Canvas Background with Grid Pattern -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1" />
    </pattern>
    <rect width="1200" height="680" fill="url(#grid)" />
  </g>

  <!-- Canvas Header -->
  <g transform="translate(50, 35)">
    <circle cx="16" cy="16" r="16" fill="#0284c7" opacity="0.2" />
    <circle cx="16" cy="16" r="8" fill="#38bdf8" filter="url(#glowCyan)" />
    <text x="44" y="16" class="title">CycloNerveAI Enterprise Architecture</text>
    <text x="44" y="32" class="subtitle">NEURO-SYMBOLIC LIFELINE CASCADE INTELLIGENCE &amp; STATUTORY EOC DEFENSE</text>
    <rect x="990" y="3" width="160" height="26" rx="6" fill="#0369a1" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1" />
    <text x="1070" y="20" text-anchor="middle" class="badge-text" fill="#38bdf8">TIER_0_CLOUD_EDGE</text>
  </g>

  <!-- ==================== LAYER 1: CLIENT PRESENTATION LAYER ==================== -->
  <g transform="translate(50, 85)">
    <rect width="1100" height="105" rx="10" fill="url(#cardGradClient)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect x="20" y="-10" width="220" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="130" y="5" text-anchor="middle" class="layer-header" fill="#38bdf8">1. Client Interaction Layer</text>

    <!-- Client Item 1 -->
    <g transform="translate(25, 25)">
      <rect width="250" height="65" rx="6" fill="#0f172a" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="20" cy="22" r="10" fill="#2563eb" fill-opacity="0.3" />
      <text x="20" y="26" text-anchor="middle" font-size="11" fill="#60a5fa">🗺️</text>
      <text x="38" y="22" class="item-title">Geospatial Situation Map</text>
      <text x="38" y="38" class="item-desc">Interactive Leaflet / SVG Overlays</text>
      <text x="38" y="52" class="item-desc">Storm Tracks &amp; SAR Flood Inundation</text>
    </g>

    <!-- Client Item 2 -->
    <g transform="translate(295, 25)">
      <rect width="250" height="65" rx="6" fill="#0f172a" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="20" cy="22" r="10" fill="#059669" fill-opacity="0.3" />
      <text x="20" y="26" text-anchor="middle" font-size="11" fill="#34d399">⚡</text>
      <text x="38" y="22" class="item-title">DAG Cascade Visualizer</text>
      <text x="38" y="38" class="item-desc">Topological Failure Propagation</text>
      <text x="38" y="52" class="item-desc">Cycle-Safe Lifeline Dependency Graph</text>
    </g>

    <!-- Client Item 3 -->
    <g transform="translate(565, 25)">
      <rect width="250" height="65" rx="6" fill="#0f172a" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="20" cy="22" r="10" fill="#d97706" fill-opacity="0.3" />
      <text x="20" y="26" text-anchor="middle" font-size="11" fill="#fbbf24">🎯</text>
      <text x="38" y="22" class="item-title">Intervention Optimizer</text>
      <text x="38" y="38" class="item-desc">Pareto Frontier &amp; ROI Multipliers</text>
      <text x="38" y="52" class="item-desc">Plan Alpha 4.22x Loss Avoidance</text>
    </g>

    <!-- Client Item 4 -->
    <g transform="translate(835, 25)">
      <rect width="240" height="65" rx="6" fill="#0f172a" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="20" cy="22" r="10" fill="#9333ea" fill-opacity="0.3" />
      <text x="20" y="26" text-anchor="middle" font-size="11" fill="#c084fc">🧒</text>
      <text x="38" y="22" class="item-title">Story Mode / AI Desk</text>
      <text x="38" y="38" class="item-desc">Plain-English 5 Ws &amp; How</text>
      <text x="38" y="52" class="item-desc">Kid Mode vs. Commander Mode</text>
    </g>
  </g>

  <!-- Inter-Layer Data Bus Arrow -->
  <g transform="translate(600, 195)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
    <polygon points="0,22 -4,15 4,15" fill="#38bdf8" />
  </g>

  <!-- ==================== LAYER 2: NEURO-SYMBOLIC CORE DUAL ENGINES ==================== -->
  <g transform="translate(50, 222)">
    <!-- Pillar 2A: Symbolic Core (Left) -->
    <g transform="translate(0, 0)">
      <rect width="535" height="150" rx="10" fill="url(#cardGradSymbolic)" stroke="#0e7490" stroke-width="1.5" />
      <rect x="20" y="-10" width="260" height="22" rx="4" fill="#082f49" stroke="#22d3ee" stroke-width="1" />
      <text x="150" y="5" text-anchor="middle" class="layer-header" fill="#22d3ee">2A. Deterministic Symbolic Core</text>

      <g transform="translate(25, 25)">
        <!-- Symbolic Box 1 -->
        <rect width="230" height="50" rx="5" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
        <text x="12" y="20" class="item-title">Composite Risk Arithmetic</text>
        <text x="12" y="36" class="tag" fill="#38bdf8">Risk = H × E × V × C (Auditable)</text>
      </g>

      <g transform="translate(275, 25)">
        <!-- Symbolic Box 2 -->
        <rect width="235" height="50" rx="5" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
        <text x="12" y="20" class="item-title">Cycle-Safe DAG Engine</text>
        <text x="12" y="36" class="tag" fill="#38bdf8">Tarjan Loop Detect &amp; Diamond Dedupe</text>
      </g>

      <g transform="translate(25, 85)">
        <!-- Symbolic Box 3 -->
        <rect width="230" height="50" rx="5" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
        <text x="12" y="20" class="item-title">Pareto Action Optimizer</text>
        <text x="12" y="36" class="tag" fill="#38bdf8">Budget &amp; Staging Time Constraint</text>
      </g>

      <g transform="translate(275, 85)">
        <!-- Symbolic Box 4 -->
        <rect width="235" height="50" rx="5" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
        <text x="12" y="20" class="item-title">15 Coastal Basin Topologies</text>
        <text x="12" y="36" class="tag" fill="#38bdf8">Odisha, Leyte, Tampa, Suva, etc.</text>
      </g>
    </g>

    <!-- Pillar 2B: Neural Multimodal Intelligence (Right) -->
    <g transform="translate(565, 0)">
      <rect width="535" height="150" rx="10" fill="url(#cardGradNeural)" stroke="#7e22ce" stroke-width="1.5" />
      <rect x="20" y="-10" width="280" height="22" rx="4" fill="#3b0764" stroke="#c084fc" stroke-width="1" />
      <text x="160" y="5" text-anchor="middle" class="layer-header" fill="#c084fc">2B. Neural Multimodal Intelligence</text>

      <g transform="translate(25, 25)">
        <!-- Neural Box 1 -->
        <rect width="230" height="50" rx="5" fill="#581c87" fill-opacity="0.4" stroke="#9333ea" stroke-width="1" />
        <text x="12" y="20" class="item-title">Gemini 2.5 Flash Companion</text>
        <text x="12" y="36" class="tag" fill="#e9d5ff">Agentic RAG &amp; Function Calling</text>
      </g>

      <g transform="translate(275, 25)">
        <!-- Neural Box 2 -->
        <rect width="235" height="50" rx="5" fill="#581c87" fill-opacity="0.4" stroke="#9333ea" stroke-width="1" />
        <text x="12" y="20" class="item-title">Two-Tier Safety Verifier</text>
        <text x="12" y="36" class="tag" fill="#e9d5ff">Zero Speculative Casualty Claims</text>
      </g>

      <g transform="translate(25, 85)">
        <!-- Neural Box 3 -->
        <rect width="230" height="50" rx="5" fill="#581c87" fill-opacity="0.4" stroke="#9333ea" stroke-width="1" />
        <text x="12" y="20" class="item-title">Multilingual Advisory Draft</text>
        <text x="12" y="36" class="tag" fill="#e9d5ff">English, Hindi, Odia, Telugu</text>
      </g>

      <g transform="translate(275, 85)">
        <!-- Neural Box 4 -->
        <rect width="235" height="50" rx="5" fill="#581c87" fill-opacity="0.4" stroke="#9333ea" stroke-width="1" />
        <text x="12" y="20" class="item-title">Multimodal SAR Evidence</text>
        <text x="12" y="36" class="tag" fill="#e9d5ff">Sentinel-1 Radar + Ground Telemetry</text>
      </g>
    </g>
  </g>

  <!-- Inter-Layer Arrow -->
  <g transform="translate(600, 377)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" />
    <polygon points="0,22 -4,15 4,15" fill="#f59e0b" />
  </g>

  <!-- ==================== LAYER 3: STATUTORY SECURITY & DEFENSE-IN-DEPTH ==================== -->
  <g transform="translate(50, 404)">
    <rect width="1100" height="95" rx="10" fill="url(#cardGradSecurity)" stroke="#b45309" stroke-width="1.5" />
    <rect x="20" y="-10" width="310" height="22" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text x="175" y="5" text-anchor="middle" class="layer-header" fill="#f59e0b">3. Statutory Security &amp; Gatekeeper</text>

    <!-- Security Module 1 -->
    <g transform="translate(25, 20)">
      <rect width="195" height="60" rx="5" fill="#29140d" stroke="#d97706" stroke-width="1" />
      <text x="12" y="22" class="item-title">Dual-Officer 2FA Quorum</text>
      <text x="12" y="38" class="item-desc">Mandatory Two-Key Approval</text>
      <text x="12" y="50" class="tag" fill="#fcd34d">FIPS-140-3 / FIDO2 Gate</text>
    </g>

    <!-- Security Module 2 -->
    <g transform="translate(240, 20)">
      <rect width="195" height="60" rx="5" fill="#29140d" stroke="#d97706" stroke-width="1" />
      <text x="12" y="22" class="item-title">Role-Based Access (RBAC)</text>
      <text x="12" y="38" class="item-desc">Commander, Analyst, Field, Viewer</text>
      <text x="12" y="50" class="tag" fill="#fcd34d">Strict Least-Privilege Rules</text>
    </g>

    <!-- Security Module 3 -->
    <g transform="translate(455, 20)">
      <rect width="195" height="60" rx="5" fill="#29140d" stroke="#d97706" stroke-width="1" />
      <text x="12" y="22" class="item-title">WORM Cryptographic Chain</text>
      <text x="12" y="38" class="item-desc">Write-Once-Read-Many Ledger</text>
      <text x="12" y="50" class="tag" fill="#fcd34d">SHA-256 Merkle Roots</text>
    </g>

    <!-- Security Module 4 -->
    <g transform="translate(670, 20)">
      <rect width="195" height="60" rx="5" fill="#29140d" stroke="#d97706" stroke-width="1" />
      <text x="12" y="22" class="item-title">Vertex AI Model Armor</text>
      <text x="12" y="38" class="item-desc">Prompt Leakage &amp; Role Escape</text>
      <text x="12" y="50" class="tag" fill="#fcd34d">Adversarial Jailbreak Shield</text>
    </g>

    <!-- Security Module 5 -->
    <g transform="translate(885, 20)">
      <rect width="190" height="60" rx="5" fill="#29140d" stroke="#d97706" stroke-width="1" />
      <text x="12" y="22" class="item-title">L7 Edge WAF &amp; Armor</text>
      <text x="12" y="38" class="item-desc">OWASP Top 10 + IP Rate Limits</text>
      <text x="12" y="50" class="tag" fill="#fcd34d">Global Cloud Armor Policy</text>
    </g>
  </g>

  <!-- Inter-Layer Arrow -->
  <g transform="translate(600, 504)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2" />
    <polygon points="0,22 -4,15 4,15" fill="#10b981" />
  </g>

  <!-- ==================== LAYER 4: CLOUD ADAPTERS & METEOROLOGICAL INGEST ==================== -->
  <g transform="translate(50, 527)">
    <rect width="1100" height="115" rx="10" fill="url(#cardGradAdapters)" stroke="#065f46" stroke-width="1.5" />
    <rect x="20" y="-10" width="360" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="200" y="5" text-anchor="middle" class="layer-header" fill="#34d399">4. Server-Side Cloud Adapters &amp; Real Ingest</text>

    <!-- Adapter 1: Earth Engine -->
    <g transform="translate(25, 25)">
      <rect width="140" height="72" rx="5" fill="#042f2e" stroke="#059669" stroke-width="1" />
      <text x="70" y="22" text-anchor="middle" font-size="14">🛰️</text>
      <text x="70" y="40" text-anchor="middle" class="item-title">Earth Engine</text>
      <text x="70" y="55" text-anchor="middle" class="item-desc">Sentinel-1 SAR Radar</text>
      <text x="70" y="68" text-anchor="middle" class="tag" fill="#6ee7b7">Live ADC OAuth2</text>
    </g>

    <!-- Adapter 2: BigQuery GIS -->
    <g transform="translate(180, 25)">
      <rect width="140" height="72" rx="5" fill="#042f2e" stroke="#059669" stroke-width="1" />
      <text x="70" y="22" text-anchor="middle" font-size="14">📊</text>
      <text x="70" y="40" text-anchor="middle" class="item-title">BigQuery GIS</text>
      <text x="70" y="55" text-anchor="middle" class="item-desc">ST_DWithin Spatial</text>
      <text x="70" y="68" text-anchor="middle" class="tag" fill="#6ee7b7">Demographic Grid</text>
    </g>

    <!-- Adapter 3: Cloud Firestore -->
    <g transform="translate(335, 25)">
      <rect width="140" height="72" rx="5" fill="#042f2e" stroke="#059669" stroke-width="1" />
      <text x="70" y="22" text-anchor="middle" font-size="14">🔥</text>
      <text x="70" y="40" text-anchor="middle" class="item-title">Cloud Firestore</text>
      <text x="70" y="55" text-anchor="middle" class="item-desc">WORM Audit Logs</text>
      <text x="70" y="68" text-anchor="middle" class="tag" fill="#6ee7b7">Create-Only Rules</text>
    </g>

    <!-- Adapter 4: Cloud Storage -->
    <g transform="translate(490, 25)">
      <rect width="140" height="72" rx="5" fill="#042f2e" stroke="#059669" stroke-width="1" />
      <text x="70" y="22" text-anchor="middle" font-size="14">🪣</text>
      <text x="70" y="40" text-anchor="middle" class="item-title">Cloud Storage</text>
      <text x="70" y="55" text-anchor="middle" class="item-desc">V4 Signed URLs</text>
      <text x="70" y="68" text-anchor="middle" class="tag" fill="#6ee7b7">Disaster Rasters</text>
    </g>

    <!-- Adapter 5: Google Maps Platform -->
    <g transform="translate(645, 25)">
      <rect width="140" height="72" rx="5" fill="#042f2e" stroke="#059669" stroke-width="1" />
      <text x="70" y="22" text-anchor="middle" font-size="14">📍</text>
      <text x="70" y="40" text-anchor="middle" class="item-title">Google Maps</text>
      <text x="70" y="55" text-anchor="middle" class="item-desc">Routes &amp; Elevation</text>
      <text x="70" y="68" text-anchor="middle" class="tag" fill="#6ee7b7">Safe Evacuation</text>
    </g>

    <!-- Adapter 6: Open-Meteo Marine -->
    <g transform="translate(800, 25)">
      <rect width="140" height="72" rx="5" fill="#042f2e" stroke="#059669" stroke-width="1" />
      <text x="70" y="22" text-anchor="middle" font-size="14">🌊</text>
      <text x="70" y="40" text-anchor="middle" class="item-title">Open-Meteo API</text>
      <text x="70" y="55" text-anchor="middle" class="item-desc">Wave Height &amp; Wind</text>
      <text x="70" y="68" text-anchor="middle" class="tag" fill="#6ee7b7">Live Real-Time</text>
    </g>

    <!-- Adapter 7: Cell Broadcast / CAP -->
    <g transform="translate(955, 25)">
      <rect width="120" height="72" rx="5" fill="#042f2e" stroke="#059669" stroke-width="1" />
      <text x="60" y="22" text-anchor="middle" font-size="14">📢</text>
      <text x="60" y="40" text-anchor="middle" class="item-title">Cell Broadcast</text>
      <text x="60" y="55" text-anchor="middle" class="item-desc">CAP v1.2 XML Sirens</text>
      <text x="60" y="68" text-anchor="middle" class="tag" fill="#6ee7b7">Multi-Channel</text>
    </g>
  </g>
</svg>
