<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="stepGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Marker Arrow -->
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
  </defs>

  <style>
    .flow-title { font-family: 'Inter', system-ui, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
    .flow-subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #38bdf8; letter-spacing: 1px; }
    .step-number { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
    .step-heading { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .step-subtext { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; line-height: 1.4; }
    .step-metric { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#flowBg)" />

  <!-- Flow Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" class="flow-title">Mission-Critical Incident Commander User Flow</text>
    <text x="0" y="20" class="flow-subtitle">FROM LIVE METEOROLOGICAL DETECTION TO STATUTORY DUAL-OFFICER DISPATCH</text>
  </g>

  <!-- Process Steps Sequence -->
  <g transform="translate(50, 95)">
    <!-- Connecting Timeline Track -->
    <line x1="80" y1="120" x2="1020" y2="120" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="80" y1="120" x2="1020" y2="120" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

    <!-- STEP 1: Storm Detection & Surge Forecast -->
    <g transform="translate(0, 30)">
      <rect width="200" height="240" rx="10" fill="url(#stepGrad1)" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="100" cy="35" r="22" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <text x="100" y="40" text-anchor="middle" font-size="18">🌀</text>
      <text x="100" y="80" text-anchor="middle" class="step-heading">1. Surge Ingest</text>
      <text x="100" y="98" text-anchor="middle" class="badge" fill="#38bdf8">T - 14.0 HOURS</text>
      
      <text x="20" y="130" class="step-subtext">• Live Open-Meteo &amp; SAR</text>
      <text x="20" y="150" class="step-subtext">• Central: 938 hPa low</text>
      <text x="20" y="170" class="step-subtext">• Predicted surge: 3.6m MSL</text>
      <text x="20" y="190" class="step-subtext">• Floodwall: 2.8m threshold</text>

      <rect x="20" y="205" width="160" height="22" rx="4" fill="#0369a1" fill-opacity="0.4" />
      <text x="100" y="220" text-anchor="middle" class="step-metric" fill="#7dd3fc">+0.80m Overtopping</text>
    </g>

    <!-- STEP 2: DAG Cascade Traversal -->
    <g transform="translate(225, 30)">
      <rect width="200" height="240" rx="10" fill="url(#stepGrad2)" stroke="#059669" stroke-width="1.5" />
      <circle cx="100" cy="35" r="22" fill="#047857" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5" />
      <text x="100" y="40" text-anchor="middle" font-size="18">⚡</text>
      <text x="100" y="80" text-anchor="middle" class="step-heading">2. Cascade Trace</text>
      <text x="100" y="98" text-anchor="middle" class="badge" fill="#34d399">T + 0.7 HOURS</text>
      
      <text x="20" y="130" class="step-subtext">• Dhamra Substation trips</text>
      <text x="20" y="150" class="step-subtext">• 220kV busbar arcs out</text>
      <text x="20" y="170" class="step-subtext">• Bhadrak Hospital loses grid</text>
      <text x="20" y="190" class="step-subtext">• Telecom tower battery: 4h</text>

      <rect x="20" y="205" width="160" height="22" rx="4" fill="#065f46" fill-opacity="0.4" />
      <text x="100" y="220" text-anchor="middle" class="step-metric" fill="#6ee7b7">48 ICU Patients at Risk</text>
    </g>

    <!-- STEP 3: Counterfactual Plan Optimizer -->
    <g transform="translate(450, 30)">
      <rect width="200" height="240" rx="10" fill="url(#stepGrad3)" stroke="#d97706" stroke-width="1.5" />
      <circle cx="100" cy="35" r="22" fill="#b45309" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1.5" />
      <text x="100" y="40" text-anchor="middle" font-size="18">📊</text>
      <text x="100" y="80" text-anchor="middle" class="step-heading">3. Plan Alpha Opt</text>
      <text x="100" y="98" text-anchor="middle" class="badge" fill="#fbbf24">T - 3.75H WINDOW</text>
      
      <text x="20" y="130" class="step-subtext">• Pareto optimizer runs</text>
      <text x="20" y="150" class="step-subtext">• Stage 4 dewatering pumps</text>
      <text x="20" y="170" class="step-subtext">• Mobile 500kVA generator</text>
      <text x="20" y="190" class="step-subtext">• Move before road R-16 cuts</text>

      <rect x="20" y="205" width="160" height="22" rx="4" fill="#78350f" fill-opacity="0.4" />
      <text x="100" y="220" text-anchor="middle" class="step-metric" fill="#fde68a">4.22x ROI (₹78L Saved)</text>
    </g>

    <!-- STEP 4: Dual-Officer 2FA Quorum -->
    <g transform="translate(675, 30)">
      <rect width="200" height="240" rx="10" fill="url(#stepGrad4)" stroke="#dc2626" stroke-width="1.5" />
      <circle cx="100" cy="35" r="22" fill="#991b1b" fill-opacity="0.3" stroke="#f87171" stroke-width="1.5" />
      <text x="100" y="40" text-anchor="middle" font-size="18">🛡️</text>
      <text x="100" y="80" text-anchor="middle" class="step-heading">4. Dual-Officer 2FA</text>
      <text x="100" y="98" text-anchor="middle" class="badge" fill="#f87171">STATUTORY GATE</text>
      
      <text x="20" y="130" class="step-subtext">• Mandatory Two-Key Sign</text>
      <text x="20" y="150" class="step-subtext">• Commander: Key A (FIDO2)</text>
      <text x="20" y="170" class="step-subtext">• Field Lead: Key B (2FA)</text>
      <text x="20" y="190" class="step-subtext">• Evidence review certified</text>

      <rect x="20" y="205" width="160" height="22" rx="4" fill="#7f1d1d" fill-opacity="0.4" />
      <text x="100" y="220" text-anchor="middle" class="step-metric" fill="#fca5a5">Zero Autonomous Alerts</text>
    </g>

    <!-- STEP 5: Public Broadcast & Immutable WORM -->
    <g transform="translate(900, 30)">
      <rect width="200" height="240" rx="10" fill="url(#stepGrad5)" stroke="#7c3aed" stroke-width="1.5" />
      <circle cx="100" cy="35" r="22" fill="#6d28d9" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1.5" />
      <text x="100" y="40" text-anchor="middle" font-size="18">📢</text>
      <text x="100" y="80" text-anchor="middle" class="step-heading">5. WORM Dispatch</text>
      <text x="100" y="98" text-anchor="middle" class="badge" fill="#a78bfa">SEALED IN MERKLE</text>
      
      <text x="20" y="130" class="step-subtext">• Cell Broadcast sirens live</text>
      <text x="20" y="150" class="step-subtext">• CAP v1.2 XML multi-lingual</text>
      <text x="20" y="170" class="step-subtext">• SHA-256 Merkle chain hash</text>
      <text x="20" y="190" class="step-subtext">• Write-once immutable audit</text>

      <rect x="20" y="205" width="160" height="22" rx="4" fill="#4c1d95" fill-opacity="0.4" />
      <text x="100" y="220" text-anchor="middle" class="step-metric" fill="#ddd6fe">184,200 Neighbors Warned</text>
    </g>
  </g>

  <!-- Flow Progress Callout Footer -->
  <g transform="translate(50, 420)">
    <rect width="1100" height="36" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="23" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">
      <tspan fill="#38bdf8" font-weight="700">HUMAN EMOTIONAL RESONANCE:</tspan> Dual-Mode Interface switches instantly between <tspan fill="#f59e0b">🛡️ Tactical EOC Commander</tspan> (MWh deficits &amp; barometric drops) and <tspan fill="#34d399">🧒 Simple Story Mode</tspan> (falling dominoes, rescue trucks, and flashlights for families).
    </text>
  </g>
</svg>
