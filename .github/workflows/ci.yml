name: CI - CycloNerveAI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript & Syntax
        run: npm run lint

      - name: Strict Type Check
        run: npm run type-check

  unit-and-integration-tests:
    name: Automated Test Suite (Unit & Integration)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Domain & Agent Unit Tests
        run: npm run test:unit

      - name: Run Cloud Adapter & Security Integration Tests
        run: npm run test:integration

      - name: Run Full Master Test Suite
        run: npm test

  production-build:
    name: Production Client & Server Build
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Production Bundle (Vite)
        run: npm run build

      - name: Verify Dist Artifacts Exist
        run: |
          test -f dist/index.html
          echo "Production assets successfully generated in dist/"
